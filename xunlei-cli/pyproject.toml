[project]
name = "xunlei-cli"
version = "0.1.0"
description = "CLI tool for Xunlei cloud drive and VIP download acceleration"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1.0",
    "fastapi>=0.110.0",
    "filelock>=3.0.0",
    "httpx>=0.27.0",
    "jinja2>=3.0.0",
    "rich>=13.0.0",
    "uvicorn>=0.29.0",
]

[project.scripts]
xunlei = "xunlei.cli:main"
